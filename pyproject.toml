[project]
name = "rill"
version = "0.1.0"
description = "Self-hosted RSS reader with one-tap save to an Obsidian inbox"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "feedparser",
  "trafilatura",
  "markdownify",
  "nh3",
]

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[tool.setuptools.packages.find]
include = ["rill*"]

[tool.setuptools.package-data]
rill = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
