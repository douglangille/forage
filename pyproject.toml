[project]
name = "forage"
version = "0.1.0"
description = "Self-hosted RSS reader with one-tap save to an Obsidian inbox"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Doug Langille" }]
keywords = ["rss", "reader", "obsidian", "pwa", "self-hosted"]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "feedparser",
  "trafilatura",
  "markdownify",
  "nh3",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["forage*"]

[tool.setuptools.package-data]
forage = ["static/*", "static/icons/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
