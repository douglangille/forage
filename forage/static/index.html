<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forage</title>
<meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191724" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="{{TOUCH_ICON}}">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" data-view="list">
  <aside id="side">
    <header class="side-head">
      <h1>Forage</h1>
      <button id="btn-refresh" class="icon" title="Refresh all (r)" aria-label="Refresh">⟳</button>
      <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">⚙</button>
    </header>
    <nav id="nav"></nav>
    <footer class="side-foot">
      <button id="btn-add" class="linkish">+ Find feeds</button>
      <button id="btn-manage" class="linkish">Manage</button>
    </footer>
  </aside>

  <section id="list-pane">
    <header class="pane-head">
      <button id="btn-menu" class="icon only-narrow" aria-label="Feeds">☰</button>
      <h2 id="list-title">Unread</h2>
      <button id="btn-editfeed" class="icon" title="Edit this feed" aria-label="Edit this feed" hidden>✎</button>
      <div class="spacer"></div>
      <button id="btn-filter" class="chip" title="Toggle unread only (u)">Unread</button>
      <button id="btn-markall" class="icon" title="Mark all read" aria-label="Mark all read">✓✓</button>
    </header>
    <div class="searchbar"><input id="q" type="search" placeholder="Search titles…" autocomplete="off"></div>
    <ul id="entries"></ul>
    <div id="list-empty" hidden>Nothing here. Go outside.</div>
  </section>

  <main id="reader">
    <div id="reader-empty">Pick something to read.</div>
    <article id="article" hidden>
      <header class="art-head">
        <button id="btn-back" class="icon only-narrow" aria-label="Back">‹</button>
        <div class="spacer"></div>
        <button id="btn-prev" class="icon" title="Previous (k)" aria-label="Previous">↑</button>
        <button id="btn-next" class="icon" title="Next (j)" aria-label="Next">↓</button>
        <button id="btn-star" class="icon" title="Star" aria-label="Star">☆</button>
        <button id="btn-unread" class="icon" title="Mark unread (m)" aria-label="Mark unread">●</button>
        <a id="btn-open" class="icon" target="_blank" rel="noopener" title="Open original (o)" aria-label="Open original">↗</a>
        <button id="btn-save" class="icon save-btn" title="Save to Obsidian inbox (s)" aria-label="Save to Obsidian"></button>
      </header>
      <div class="art-scroll" id="art-scroll">
        <div class="art-body">
          <p class="meta" id="art-meta"></p>
          <h1 id="art-title"></h1>
          <div id="art-content" class="prose"></div>
        </div>
      </div>
    </article>
  </main>
  <div id="scrim"></div>
</div>

<dialog id="dlg-add">
  <form method="dialog" id="form-add">
    <h3>Find feeds</h3>
    <div class="searchrow">
      <input id="add-url" type="text" inputmode="search" autocapitalize="off" autocorrect="off" required placeholder="Keywords, a site, or a feed address" aria-label="Search or address">
      <button class="primary" id="add-go">Search</button>
    </div>
    <label>Add to folder <select id="add-folder"></select></label>
    <input id="add-folder-new" type="text" placeholder="New folder name" autocapitalize="words" hidden>
    <p id="add-msg" class="msg"></p>
    <ul id="results"></ul>
    <div class="row"><button type="button" class="linkish" id="add-cancel">Close</button></div>
  </form>
</dialog>

<dialog id="dlg-manage">
  <h3>Manage feeds</h3>
  <div class="row wrap">
    <button class="btn linkish" id="manage-find">Find feeds…</button>
    <label class="btn linkish">Import OPML<input type="file" id="opml-file" accept=".opml,.xml,text/xml" hidden></label>
    <a class="btn linkish" href="/api/opml" download="forage.opml">Export OPML</a>
  </div>
  <ul id="manage-list"></ul>
  <div class="row"><button class="primary" id="manage-close">Done</button></div>
</dialog>

<dialog id="dlg-feed">
  <form id="form-feed" method="dialog">
    <h3>Edit feed</h3>
    <label>Name <input id="feed-title" type="text" autocapitalize="words"></label>
    <label>Folder <select id="feed-folder"></select></label>
    <input id="feed-folder-new" type="text" placeholder="New folder name" autocapitalize="words" hidden>
    <p id="feed-url" class="hint"></p>
    <p id="feed-msg" class="msg"></p>
    <div class="row between"><button type="button" class="danger" id="feed-remove">Remove feed</button><span class="grow"></span><button type="button" class="linkish" id="feed-cancel">Cancel</button><button class="primary" id="feed-save">Save</button></div>
  </form>
</dialog>

<dialog id="dlg-settings">
  <form id="form-settings" method="dialog">
    <h3>Settings</h3>
    <label>Obsidian inbox folder
      <input id="set-inbox" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="/path/to/your/vault/inbox">
    </label>
    <p id="set-inbox-note" class="hint"></p>
    <label class="check"><input id="set-git" type="checkbox"> Commit and push each saved clip</label>
    <p id="set-git-note" class="hint"></p>
    <label class="check"><input id="set-wiki" type="checkbox"> Write the author as a [[wikilink]]</label>
    <label>Check for new articles every <span class="inline"><input id="set-refresh" type="number" min="5" max="1440" step="5" inputmode="numeric"> minutes</span></label>
    <p id="set-msg" class="msg"></p>
    <div class="row"><button type="button" class="linkish" id="set-cancel">Cancel</button><button class="primary" id="set-save">Save</button></div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
